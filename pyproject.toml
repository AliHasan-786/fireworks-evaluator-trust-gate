[project]
name = "fireworks-evaluator-trust-gate"
version = "0.1.0"
description = "Customer-side validation for automated evaluators before RFT or deployment automation"
requires-python = ">=3.11"
dependencies = [
  "fireworks-ai>=0.19.20",
  "pydantic>=2.10",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
eval-protocol = ["eval-protocol>=0.3.0"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires FIREWORKS_API_KEY and may incur cost"]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
